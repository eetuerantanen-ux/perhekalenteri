<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6b4a2f">
<title>Perhekalenteri</title>
<link rel="icon" href="data:,">
<meta name="app-version" content="3b9a8a07e5">
<link rel="stylesheet" href="style.css?v=3b9a8a07e5">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="brand-title">Meidän perheen</span>
      <nav class="view-nav" aria-label="Näkymä">
        <a href="#paiva" class="view-link is-active" data-view="paiva" id="navPaiva">päivä</a>
        <span class="view-sep" aria-hidden="true">·</span>
        <a href="#viikko" class="view-link" data-view="viikko" id="navViikko">viikko</a>
        <span class="view-sep" aria-hidden="true">·</span>
        <a href="#kuukausi" class="view-link" data-view="kuukausi" id="navKuukausi">kuukausi</a>
      </nav>
      <span class="brand-sub" id="brandSub"></span>
    </div>
    <div class="members" id="members"></div>
    <div class="status" id="status"></div>
  </header>

  <main class="grid" id="dayView">
    <section class="col col-a">
      <div class="card clock">
        <div class="time" id="time">--:--</div>
        <div class="date-row">
          <div><div class="date" id="date"></div><div class="week" id="week"></div></div>
          <div class="price p-none" id="price"></div>
        </div>
      </div>
      <div class="card weather" id="weather">
        <div class="card-title">Sää · Koria</div>
        <div class="empty">Ladataan…</div>
      </div>
    </section>

    <section class="col col-b">
      <div class="card today" id="today" role="button" tabindex="0" aria-label="Näytä päivän kaikki tapahtumat">
        <div class="card-title">Tänään</div>
      </div>
      <div class="card menu" id="menu" role="button" tabindex="0" aria-label="Avaa koko viikon ruokalista">
        <div class="card-title">Ruokalista</div>
      </div>
    </section>

    <section class="col col-c">
      <div class="card upcoming" id="upcoming">
        <div class="card-title">Tulevat päivät</div>
      </div>
      <div class="row2">
        <div class="card reminders" id="reminders" role="button" tabindex="0" aria-label="Näytä kaikki muistutukset">
          <div class="card-title">Muistutukset</div>
        </div>
        <div class="card todo" id="todo" role="button" tabindex="0" aria-label="Näytä koko muistilista">
          <div class="card-title">Muistilista</div>
        </div>
      </div>
    </section>
  </main>

  <main class="calview" id="weekView" hidden>
    <div class="calview-bar">
      <button type="button" class="back-btn" data-back>Paluu</button>
      <div class="calview-title" id="weekTitle"></div>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </main>

  <main class="calview" id="monthView" hidden>
    <div class="calview-bar">
      <button type="button" class="back-btn" data-back>Paluu</button>
      <div class="calview-title" id="monthTitle"></div>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>
<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-card" autocomplete="on">
    <div class="lock-title">Perhekalenteri</div>
    <p>Anna salasana avataksesi kalenterin. Salasana muistetaan tällä laitteella.</p>
    <input id="lockPw" type="password" autocomplete="current-password" placeholder="Salasana" aria-label="Salasana">
    <button id="lockBtn" type="submit">Avaa</button>
    <div id="lockMsg" class="lock-msg"></div>
  </form>
</div>
<div id="dayPop" class="daypop" hidden>
  <div class="daypop-card" role="dialog" aria-modal="true" aria-labelledby="dayPopTitle">
    <button type="button" class="daypop-x" data-daypop-close aria-label="Sulje">×</button>
    <div class="daypop-head">
      <div class="daypop-title" id="dayPopTitle"></div>
      <div class="daypop-meta" id="dayPopMeta"></div>
    </div>
    <div class="daypop-body" id="dayPopBody"></div>
    <button type="button" class="daypop-close" data-daypop-close>Sulje</button>
  </div>
</div>
<div id="pricePop" class="daypop pricepop" hidden>
  <div class="daypop-card" role="dialog" aria-modal="true" aria-labelledby="pricePopTitle">
    <button type="button" class="daypop-x" data-pricepop-close aria-label="Sulje">×</button>
    <div class="daypop-head">
      <nav class="daypop-title pp-tabs" id="pricePopTitle" aria-label="Sähkön hinta">
        <a href="#" class="pp-tab is-active" data-pmode="spot">Pörssisähkön hinta</a>
        <span class="pp-sep" aria-hidden="true">·</span>
        <a href="#" class="pp-tab" data-pmode="fc">Pörssisähkön hintaennuste</a>
      </nav>
      <div class="daypop-meta" id="pricePopMeta"></div>
    </div>
    <div class="daypop-body" id="pricePopBody"></div>
    <button type="button" class="daypop-close" data-pricepop-close>Sulje</button>
  </div>
</div>
<div id="infoPop" class="daypop infopop" hidden>
  <div class="daypop-card" role="dialog" aria-modal="true" aria-labelledby="infoPopTitle">
    <button type="button" class="daypop-x" data-infopop-close aria-label="Sulje">×</button>
    <div class="daypop-head">
      <div class="daypop-title" id="infoPopTitle"></div>
      <div class="daypop-meta" id="infoPopMeta"></div>
    </div>
    <div class="daypop-body" id="infoPopBody"></div>
    <button type="button" class="daypop-close" data-infopop-close>Sulje</button>
  </div>
</div>
<script src="app.js?v=3b9a8a07e5"></script>
</body>
</html>
